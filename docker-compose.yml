services:
  # 1. Redis (메시지 브로커 및 캐싱)
  redis:
    image: redis:alpine
    container_name: redis
    networks:
      - ws
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 2. Database
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
    # ${환경변수명} 문법은 OS 환경변수 혹은 .env에서 해당 환경변수명과 일치하는 항목이 있으면 대입합니다.
    # 반드시 사전에 .env에 해당 항목이 존재하는지 확인해야 합니다.
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: 'Asia/Seoul'
    ports:
      - ${DB_EXPOSE_PORT}:${DB_PORT}
    networks:
      - ws
    volumes:
      - mysql_data:/var/lib/mysql  # 컨테이너가 삭제돼도 데이터는 호스트 파일시스템에 남음
      - ./infra/docker/initdb.d:/docker-entrypoint-initdb.d:ro  # 초기 DB·권한 설정 (볼륨이 비어있을 때만 실행)
    command: # 한글 저장을 위한 문자셋 설정 (필수!)
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --port=${DB_PORT}
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. API Server (FastAPI)
  fastapi:
    container_name: fastapi
    build:
      context: .  # 프로젝트 루트를 빌드 컨텍스트로 지정
      dockerfile: app/Dockerfile  # Dockerfile 위치 지정
      platforms:
        - linux/amd64
        - linux/arm64
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:app-${APP_VERSION}  # APP_VERSION은 빌드된 이미지의 버전관리를 위함입니다. v1.0.0 형식으로 사용합니다.
    env_file: .env
    command: | 
      sh -c "uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./app:/app/app  # 로컬의 app 디렉토리를 컨테이너의 /app/app에 마운트(수정사항 즉시 반영)
      - /tmp/medical_uploads:/tmp/medical_uploads  # Worker(로컬)와 업로드 파일 공유 (KEY-56)
      - static_volume:/app/templates
    restart: always
    ports:
      - "8000:8000"
    networks:
      - ws
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. AI Worker (Model 학습 및 추론)
  ai-worker:
    container_name: ai-worker
    build:
      context: .  # 프로젝트 루트를 빌드 컨텍스트로 지정
      dockerfile: ai_worker/Dockerfile  # Dockerfile 위치 지정
      platforms:
        - linux/amd64
        - linux/arm64
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:ai-${AI_WORKER_VERSION}  # AI_WORKER_VERSION은 빌드된 이미지의 버전관리를 위함입니다. V1.0.0 형식으로 사용합니다.
    env_file: .env
    volumes:
      # **업로드 파일을 fastapi 와 나눠 쓴다.** 이것이 없으면 워커가 판독할
      # 파일을 못 찾아 `FileNotFoundError` 로 죽는다 — OCR 이 로컬에서
      # 절대 안 된다. fastapi 쪽 주석이 「Worker(로컬)와 업로드 파일 공유」
      # 라고 적어 두었는데 정작 워커에는 이 줄이 없었다.
      - /tmp/medical_uploads:/tmp/medical_uploads
    restart: always
    mem_limit: 4G
    networks:
      - ws
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 5. Nginx (웹 서버 - 요청 리버스 프록시로 전달)
  nginx:
    container_name: nginx
    image: nginx:latest
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/vol/web/static
      - ./frontend:/vol/web/frontend:ro
    ports:
      - "80:80"
    networks:
      - ws
    depends_on:
      - fastapi

  # 6. MinIO (합성 EMR 이미지 보관 — S3 호환)
  #
  # KEY-190 이 만든 고정 PNG 를 팀이 **같은 바이트로** 나눠 갖는 자리다.
  # 저장소에 바이너리를 안 두기로 했는데(KEY-68 범위 밖 첫 줄) 그러면 둘 자리가
  # 없어서, KEY-163 §8 이 「보관 위치 — 미확인」으로 열어 둔 항목이었다.
  #
  # **S3 호환이라서 고른다.** Sprint 6 에 AWS 로 가면 엔드포인트만 바꾼다.
  #
  # 태그를 digest 까지 박는다 — 이 저장소가 KEY-190 에서 정한 방식이다.
  # 「누가 언제 올려도 같은 것」이 이 서비스의 존재 이유라 판이 흔들리면 안 된다.
  minio:
    container_name: minio
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: 'Asia/Seoul'
    command: server /data --console-address ":9001"
    ports:
      # 9000 = S3 API · 9001 = 웹 콘솔.
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - ws
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mysql_data:
  static_volume:
  minio_data:

networks:
  ws:
    driver: bridge

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>안내문 승인 · 복약 안내 도우미</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/shell.css" />
    <link rel="stylesheet" href="/css/doctor.css" />
  </head>
  <body class="shell">
    <!-- D1 의사 검토·수정·승인·반려 (KEY-86)
         왼쪽 목록과 위 막대는 다른 화면과 같은 골격이다(KEY-53).
         의사 기본 탭은 「승인 요청」이고 그 선택은 shell.js 가 역할로 정한다.
         승인 뒤의 현황·발송 이력(D1-6·D1-7)은 이 티켓 밖이다. -->

    <header class="topbar">
      <span class="topbar__brand">복약 안내 도우미</span>
      <nav class="topbar__nav">
        <button class="topbar__tab" type="button" aria-current="page">현황</button>
        <button class="topbar__tab" type="button">관리</button>
        <button class="topbar__tab" type="button">설정</button>
      </nav>
      <div class="topbar__right">
        <span class="who">
          <span class="who__name" id="who-name">—</span>
          <span class="who__roles" id="who-roles"></span>
        </span>
        <button class="icon-button" type="button" aria-label="알림">
          🔔<span class="icon-button__count" id="alert-count" hidden></span>
        </button>
        <button class="icon-button" type="button" id="logout" aria-label="로그아웃">⏻</button>
      </div>
    </header>

    <div class="main">
      <aside class="list" aria-label="환자 목록">
        <div class="list__head">
          <input class="list__search" type="search" placeholder="이름 · 차트번호 검색" aria-label="환자 검색" />
        </div>
        <div class="list__day">
          <button class="icon-button" type="button" aria-label="이전 날짜">‹</button>
          <span class="grow" id="day">—</span>
          <button class="icon-button" type="button" aria-label="다음 날짜">›</button>
        </div>
        <div class="chips" id="chips" role="group" aria-label="상태로 거르기"></div>
        <div class="list__rows" id="rows"></div>
        <p class="list__note">하루 단위로 표시합니다 · 지난 날짜는 ‹ 로 이동합니다</p>
      </aside>

      <main class="pane">
        <div class="patient-head">
          <div class="patient-head__name" id="p-name">—</div>
          <div class="patient-head__id" id="p-id"></div>
          <div class="patient-head__visit" id="p-visit"></div>
        </div>

        <ol class="steps">
          <li class="step step--done"><span class="step__mark">✓</span>기본정보</li>
          <li class="step step--done"><span class="step__mark">✓</span>진료기록</li>
          <li class="step step--done"><span class="step__mark">✓</span>안내문</li>
          <li class="step step--now"><span class="step__mark">●</span>최종 확인</li>
          <li class="step"><span class="step__mark">○</span>현황</li>
        </ol>

        <h1 class="pane__title">환자가 받게 될 안내문 · 미리보기</h1>

        <!-- 몇 군데를 봐야 하는지 먼저 말한다 -->
        <p class="warnline" id="warn-line"></p>

        <div class="vtabs" id="vtabs" role="group" aria-label="안내문 항목"></div>
        <div id="panel"></div>

        <div class="footbar">
          <button class="button-ghost" type="button" id="return" disabled>스탭에 되돌리기</button>
          <span class="grow"></span>
          <span class="role-note" id="role-note" hidden>의사 역할이 있어야 눌려요</span>
          <button class="button-primary" type="button" id="approve" disabled>승인</button>
        </div>
      </main>
    </div>

    <!-- 승인·되돌리기는 화면을 갈아끼우지 않는다 — 뒤에 안내문이 남는다 -->
    <div class="modal" id="modal" hidden>
      <div class="modal__card" role="dialog" aria-modal="true" id="modal-body"></div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/session.js"></script>
    <script src="/js/shell.js"></script>
    <script src="/js/doctor-api.js"></script>
    <script src="/js/doctor.js"></script>
  </body>
</html>

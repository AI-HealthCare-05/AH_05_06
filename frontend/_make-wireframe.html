응급 문장은 못 고친다** — 식약처 기준 문장이라 약이 바뀌면 문장도 바뀐다. 사람이 손댈 자리가 아니다."}, {"id": "D1-3", "name": "최종 확인 — 생활지도", "url": "/patients.html?mock=1", "prep": "var n=0;(function pickRow(){var rs=[].slice.call(d.querySelectorAll('.row'));var r=rs.filter(function(x){return x.innerText.indexOf('승인 대기')>=0})[0];if(!r){ if(++n<40) return setTimeout(pickRow,200); r=rs[0]; }if(!r) return; r.click();var m=0;(function openTab(){var card=d.querySelector('#view-card:not([hidden])');var t=d.querySelector('[data-tab=\"final\"]');if(card&&t){t.click();var k=0;(function openSec(){var pane=d.querySelector('#panel-final');var g=pane&&pane.querySelector('[data-section=\"life\"]');if(g){g.click();return;} if(++k<30)setTimeout(openSec,200);})();return;} if(++m<40)setTimeout(openTab,200);})();})();", "why": "생활에서 챙길 것. 스탭이 고친 것이 그대로 보인다 — **고치는 화면과 승인하는 화면이 같은 문장을 본다.**"}, {"id": "D1-4", "name": "최종 확인 — 문자 설정", "url": "/patients.html?mock=1", "prep": "var n=0;(function pickRow(){var rs=[].slice.call(d.querySelectorAll('.row'));var r=rs.filter(function(x){return x.innerText.indexOf('승인 대기')>=0})[0];if(!r){ if(++n<40) return setTimeout(pickRow,200); r=rs[0]; }if(!r) return; r.click();var m=0;(function openTab(){var card=d.querySelector('#view-card:not([hidden])');var t=d.querySelector('[data-tab=\"final\"]');if(card&&t){t.click();var k=0;(function openSec(){var pane=d.querySelector('#panel-final');var g=pane&&pane.querySelector('[data-section=\"messages\"]');if(g){g.click();return;} if(++k<30)setTimeout(openSec,200);})();return;} if(++m<40)setTimeout(openTab,200);})();})();", "why": "회차별로 언제 무엇이 나가는지. **승인이 곧 발송 예약이다** — 승인과 발송 사이에 사람이 한 번 더 손대는 자리를 만들지 않는다(와이어프레임 D1-5 「스탭이 발송 버튼을 누르지 않는다」)."}, {"id": "D1-6", "name": "현황 — 이 진료의 발송·열람", "url": "/patients.html?mock=1", "prep": "var n=0;(function pickRow(){var rs=[].slice.call(d.querySelectorAll('.row'));var r=rs.filter(function(x){return x.innerText.indexOf('승인 대기')>=0})[0];if(!r){ if(++n<40) return setTimeout(pickRow,200); r=rs[0]; }if(!r) return; r.click();var m=0;(function openTab(){var card=d.querySelector('#view-card:not([hidden])');var t=d.querySelector('[data-tab=\"status\"]');if(card&&t){t.click();return;} if(++m<40)setTimeout(openTab,200);})();})();", "why": "승인 뒤 무엇이 언제 나갔고 환자가 열었는지. **문자 발송기가 아직 없어** 실제로 나간 줄이 없다 — 자리를 세우고 무엇이 없는지 적는다. 지어낸 발송 기록을 띄우지 않는다."}, {"id": "S2-1", "name": "환자 관리", "url": "/manage.html?mock=1", "prep": "", "why": "세부 상태와 이탈 배지를 같은 칸에 나란히 둔다 — 둘은 다른 축이라 하나가 다른 하나를 대신할 수 없다. 줄을 누르면 그 환자의 이력 모달(S2-2)이 뜬다."}, {"id": "S2-3", "name": "발송 예정", "url": "/manage.html?mock=1", "prep": "[].slice.call(d.querySelectorAll('[data-view]')).filter(function(b){return b.textContent.indexOf('발송 예정')>=0})[0].click();", "why": "「잘못된 번호」라 하지 않고 「발송 실패」라 한다 — 번호가 정말 틀렸는지 확인할 방법이 없다. 안 나간 것은 기간 밖이어도 보이고 자르지 않는다. 문자 충전 · 시각 변경 · 즉시 발송은 발송기가 없어 안 만들었다."}, {"id": "S2-4", "name": "발송 이력", "url": "/manage.html?mock=1", "prep": "[].slice.call(d.querySelectorAll('[data-view]')).filter(function(b){return b.textContent.indexOf('발송 이력')>=0})[0].click();", "why": "실패가 맨 위다. 열람은 안내문 단위로 기록된다 — 같은 안내문의 문자는 다 열람으로 뜬다. CSV 는 셈식 주입을 막고 EUC-KR 로 센다. 재승인은 발송기가 없어 안 만들었다."}, {"id": "D2-3", "name": "설정 — 처방", "url": "/settings.html?mock=1", "prep": "var h=[].slice.call(d.querySelectorAll('[data-fold]')).filter(function(x){return x.getAttribute('data-fold')==='sets|ENDOMETRIOSIS'})[0]; if(h){h.click(); setTimeout(function(){var r=d.querySelector('[data-set]'); r&&r.click();},400);}", "why": "왼쪽은 두 단짜리 나무다. 갈래 머리에서 회색 띠를 걷었다 — 화면에서 제일 조작기처럼 생긴 것이 아무 일도 안 하는 줄이었다. 회색은 이제 「손이 닿았거나 고른 줄」 한 가지만 뜻한다. 한 번에 한 묶음만 펼친다(넷 다 펼치면 937px, 보이는 높이는 689px)."}, {"id": "D2-4", "name": "설정 — 검사 기준선", "url": "/settings.html?mock=1", "prep": "var b=[].slice.call(d.querySelectorAll('[data-group]')).filter(function(x){return x.getAttribute('data-group')==='baseline'})[0]; b&&b.click();", "why": "비워 둘 수 있다 — 비워 두면 값과 추이만 표시하고 목표 대비 수치는 셈하지 않는다. 기준선은 검사기관과 나이에 따라 다르고, 모르는 채로 「목표까지 3 남았습니다」라고 말하는 것이 제일 나쁘다."}, {"id": "D2-5", "name": "설정 — 문자 문구", "url": "/settings.html?mock=1", "prep": "var b=[].slice.call(d.querySelectorAll('[data-group]')).filter(function(x){return x.getAttribute('data-group')==='sms'})[0]; b&&b.click();", "why": "90바이트를 EUC-KR 로 센다 — UTF-8 로 세면 한글이 3바이트라 보낼 수 있는 문구를 못 보낸다고 막는다."}, {"id": "A1-1", "name": "어드민 — 직원", "url": "/admin.html?mock=1", "prep": "", "why": "역할을 사람 말로 적는다 — 화면에 `doctor` 가 그대로 뜨고 있었다."}];

/* `srcdoc` 은 속성값이라 따옴표와 꺾쇠를 묶어야 한다 */
function esc(t) {
  return String(t).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function log(t) { document.getElementById("log").textContent = t; }

/* 화면 하나를 띄우고, 상태를 만들고, 그린 결과를 떠 온다. */
function grab(f) {
  return new Promise(function (done) {
    var fr = document.createElement("iframe");
    fr.style.cssText = "position:fixed;left:-9999px;top:0;width:1280px;height:800px;border:0";

    /* **`onload` 를 먼저 걸고 `src` 를 뒤에 준다.** 순서를 뒤집으면 빨리 뜬 화면의
       load 를 놓친다. */
    fr.onload = function () {
      var d = fr.contentDocument;

      /* **시간을 재지 않고 준비될 때까지 기다린다.** 목록이 서버(목업)에서
         오는 데 걸리는 시간은 화면마다 다르다 — 초를 찍어 두면 느린 날 빈
         화면을 떠 오고, 그것이 「데이터가 없는 화면」처럼 보여 눈에 안 띈다. */
      waitFor(d, function () {
        return d.querySelector(".row") || d.querySelector(".card") ||
               d.querySelector(".rail__row") || d.querySelector("tbody tr") ||
               d.querySelector(".blank__title");
      }, function () {
        if (f.prep) { try { new Function("d", f.prep)(d); } catch (e) {} }
        /* 손짓 뒤에도 그린 것이 붙을 때까지 기다린다 */
        setTimeout(function () { snap(d); }, f.prep ? 6000 : 500);
      });
    };

    function snap(d) {
      var b = d.body.cloneNode(true);
      b.querySelectorAll("script,.skip,link,style").forEach(function (n) { n.remove(); });
      b.querySelectorAll("a[href]").forEach(function (a) {
        var to = a.getAttribute("href");
        if (to && to.charAt(0) === "/") { a.setAttribute("title", "→ " + to); a.removeAttribute("href"); }
      });
      var cs = fr.contentWindow.getComputedStyle(d.body);
      var lay = ["display", "flex-direction", "align-items", "justify-content",
                 "padding", "background-color"]
        .map(function (k) { return k + ":" + cs.getPropertyValue(k); })
        .join(";");
      done({ html: b.innerHTML, cls: d.body.className, style: lay });
      fr.remove();
    }

    fr.src = f.url;
    document.body.appendChild(fr);
  });
}

/* 조건이 될 때까지 200ms 마다 본다. 8초가 지나면 그냥 뜬 대로 담는다 —
   못 뜨는 화면도 「못 떴다」는 사실 그대로 담기는 편이 낫다. */
function waitFor(d, ready, then) {
  var tries = 0;
  (function look() {
    if (ready() || ++tries > 40) return then();
    setTimeout(look, 200);
  })();
}

/* **화면마다 제 CSS만 담는다.** 한 벌로 몰아 담으면 안 쓰는 파일이 덮어쓴다 —
   로그인은 `style · tokens · auth` 셋만 싣는데 거기에 `blocks.css` 를 얹었더니
   이름표가 옆으로 붙고 단추가 빨개졌다. 페이지가 싣는 차례 그대로 준다. */
var PAGE_CSS = {
  "login.html":      ["style","tokens","auth"],
  "password.html":   ["style","tokens","auth"],
  "patients.html":   ["style","tokens","shell","blocks","upload","patients","detail"],
  "ocr-review.html": ["style","tokens","shell","blocks","upload","ocr-review"],
  "manage.html":     ["style","tokens","shell","blocks","detail","manage"],
  "settings.html":   ["style","tokens","shell","blocks","settings"],
  "doctor.html":     ["style","tokens","shell","blocks","doctor"],
  "admin.html":      ["style","tokens","shell","frames","admin"]
};

var cssCache = {};
async function cssFor(url) {
  var page = url.split("?")[0].replace("/", "");
  var files = PAGE_CSS[page] || ["style","tokens"];
  var out = "";
  for (var i = 0; i < files.length; i++) {
    if (!cssCache[files[i]]) {
      cssCache[files[i]] = await fetch("/css/" + files[i] + ".css").then(function (r) { return r.text(); });
    }
    out += "\n/* ===== " + files[i] + ".css ===== */\n" + cssCache[files[i]];
  }
  return out;
}

async function build() {
  var cards = "";
  for (var j = 0; j < FRAMES.length; j++) {
    log("화면 뜨는 중 " + (j + 1) + "/" + FRAMES.length + " — " + FRAMES[j].id);
    var got = await grab(FRAMES[j]);
    /* 화면 하나 = 문서 하나. `srcdoc` 이라 서버가 필요 없고, CSS 가 서로 안 섞인다. */
    var doc =
      "<!doctype html><html lang=ko><head><meta charset=utf-8><style>" +
      (await cssFor(FRAMES[j].url)) +
      "html,body{width:1280px;height:800px;overflow:hidden;margin:0}</style></head>" +
      '<body class="' + got.cls + '">' + got.html + "</body></html>";
    cards +=
      '<section class="wf" id="' + FRAMES[j].id + '">' +
      '<div class="wf__head"><span class="wf__id">' + FRAMES[j].id + "</span>" +
      '<span class="wf__name">' + FRAMES[j].name + "</span>" +
      '<span class="wf__size">1280 × 800</span></div>' +
      '<div class="wf__stage"><iframe class="wf__frame" srcdoc="' + esc(doc) + '"></iframe></div>' +
      '<p class="wf__why">' + FRAMES[j].why + "</p></section>";
  }

  log("파일 만드는 중…");
  var out = document.getElementById("tpl").textContent
    .replace("<!--__CARDS__-->", cards)
    .replace("<!--__TOC__-->", FRAMES.map(function (f) {
      return '<a href="#' + f.id + '">' + f.id + "</a>";
    }).join(""));

  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([out], { type: "text/html" }));
  a.download = "wireframe-medic-3.0.0.html";
  document.body.appendChild(a);
  a.click();
  log("만들었습니다 — " + Math.round(out.length / 1024) + "KB. 내려받기가 시작됩니다.");
  window.__out = out;
}
build();
</script>

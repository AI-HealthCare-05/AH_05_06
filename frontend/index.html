<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Healthcare</title>
</head>
<body>
  <script src="/js/api.js"></script>
  <script src="/js/session.js"></script>
  <script>
    (function () {
      function goToLogin() { location.replace('/login.html'); }

      function goToLanding(token) {
        api.me(token).then(
          function (me) { location.replace(landingFor(me.roles)); },
          goToLogin
        );
      }

      var token = session.token();
      if (token) {
        goToLanding(token);
      } else {
        api.refresh().then(
          function (res) {
            session.save(res.access_token);
            goToLanding(res.access_token);
          },
          goToLogin
        );
      }
    })();
  </script>
</body>
</html>

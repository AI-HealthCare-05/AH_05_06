<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>본인 확인 · 케어온</title>
<link rel="stylesheet" href="../css/tokens.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--surface);
    color: var(--tx);
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
  }

  @media (min-width: 431px) {
    body { background: var(--bg); }
  }

  .app {
    position: relative;
    max-width: 430px;
    margin: 0 auto;
    min-height: 100dvh;
    background: var(--surface);
    display: flex;
    flex-direction: column;
    padding: 0 24px 48px;
  }

  /* 상단 로고 영역 */
  .otp-top {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-bottom: 0;
  }

  .otp-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
  }

  .otp-logo__icon {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--p);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700;
    color: var(--p-deep);
    flex-shrink: 0;
    overflow: hidden;
  }

  .otp-logo__icon img {
    width: 100%; height: 100%; object-fit: cover;
  }

  .otp-logo__info { display: flex; flex-direction: column; gap: 2px; }
  .otp-logo__name { font-size: 16px; font-weight: 700; }
  .otp-logo__sub  { font-size: 13px; color: var(--tx-muted); }

  .otp-title {
    font-size: 28px; font-weight: 700;
    line-height: 1.3;
    margin-bottom: 8px;
  }
  .otp-sub {
    font-size: 15px; color: var(--tx-muted);
  }

  /* 전화번호 카드 */
  .otp-phone-card {
    margin-top: 28px;
    background: var(--bg);
    border-radius: var(--r-card);
    padding: 24px 20px;
    text-align: center;
  }
  .otp-phone-card__number {
    font-size: 26px; font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .otp-phone-card__hint {
    font-size: 14px; color: var(--tx-muted);
  }

  /* 하단 버튼 영역 */
  .otp-bottom {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding-top: 32px;
    margin-top: auto;
  }

  .otp-btn {
    width: 100%;
    padding: 16px;
    background: var(--p);
    border: none;
    border-radius: var(--r-btn);
    font-family: var(--font);
    font-size: 17px; font-weight: 600;
    color: var(--p-deep);
    cursor: pointer;
    transition: opacity .15s;
  }
  .otp-btn:hover { opacity: .88; }
  .otp-btn:disabled { opacity: .5; cursor: default; }

  .otp-change {
    background: none; border: none;
    font-family: var(--font);
    font-size: 14px; color: var(--p-dark);
    cursor: pointer;
    text-decoration: none;
  }

  /* 상태 화면 — 만료·폐기·오류 */
  .status-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
    padding: 24px 0;
    display: none;
  }
  .status-screen.visible { display: flex; }

  .status-icon {
    font-size: 48px;
    margin-bottom: 24px;
  }
  .status-title {
    font-size: 22px; font-weight: 700;
    margin-bottom: 12px;
    line-height: 1.4;
  }
  .status-desc {
    font-size: 15px; color: var(--tx-muted);
    line-height: 1.6;
  }
  .status-btn {
    margin-top: 32px;
    width: 100%;
    padding: 16px;
    background: var(--p);
    border: none; border-radius: var(--r-btn);
    font-family: var(--font);
    font-size: 17px; font-weight: 600;
    color: var(--p-deep);
    cursor: pointer;
  }
  .status-btn:disabled { opacity: .5; cursor: default; }
  .status-msg {
    margin-top: 16px;
    font-size: 14px; color: var(--tx-muted);
  }

  /* 로딩 */
  .loading-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--p-dark);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="app" id="app">
  <!-- 로딩 -->
  <div class="loading-wrap" id="view-loading">
    <div class="spinner"></div>
  </div>

  <!-- 정상 화면 -->
  <div class="otp-top" id="view-normal" style="display:none">
    <div class="otp-logo">
      <span class="otp-logo__icon">
        <img src="../assets/logo.png" alt="" aria-hidden="true" onerror="this.parentElement.textContent='+'">
      </span>
      <div class="otp-logo__info">
        <span class="otp-logo__name">케어온</span>
        <span class="otp-logo__sub" id="ctx-hospital-date">병원 · 진료일</span>
      </div>
    </div>

    <h1 class="otp-title">본인 확인이<br>필요해요</h1>
    <p class="otp-sub" id="ctx-visit-desc">진료 안내입니다</p>

    <div class="otp-phone-card">
      <div class="otp-phone-card__number" id="ctx-phone">010-****-****</div>
      <div class="otp-phone-card__hint">이 번호로 인증번호를 보내드려요</div>
    </div>
  </div>

  <!-- 정상 하단 버튼 -->
  <div class="otp-bottom" id="view-normal-btn" style="display:none">
    <button type="button" class="otp-btn" id="btn-issue">인증번호 받기</button>
    <button type="button" class="otp-change">번호가 바뀌셨나요?</button>
  </div>

  <!-- 링크 만료 화면 -->
  <div class="status-screen" id="view-expired">
    <div class="status-icon">⏰</div>
    <p class="status-title">링크가 만료됐어요</p>
    <p class="status-desc">안내 링크의 유효 기간이 지났어요.<br>병원에 새 링크를 요청해 주세요.</p>
    <button type="button" class="status-btn" id="btn-reissue-expired">새 링크 요청하기</button>
    <p class="status-msg" id="reissue-msg-expired" style="display:none"></p>
  </div>

  <!-- 링크 폐기 화면 -->
  <div class="status-screen" id="view-revoked">
    <div class="status-icon">🚫</div>
    <p class="status-title">더 이상 유효하지 않은<br>링크예요</p>
    <p class="status-desc">안내문이 변경되거나 링크가 폐기됐어요.<br>병원에 문의해 주세요.</p>
    <button type="button" class="status-btn" id="btn-reissue-revoked">새 링크 요청하기</button>
    <p class="status-msg" id="reissue-msg-revoked" style="display:none"></p>
  </div>

  <!-- 서버 오류 화면 -->
  <div class="status-screen" id="view-error">
    <div class="status-icon">⚠️</div>
    <p class="status-title">일시적인 오류가 생겼어요</p>
    <p class="status-desc">잠시 후 다시 시도해 주세요.<br>문제가 계속되면 병원에 문의해 주세요.</p>
  </div>
</div>

<script>
(function () {
  var API_BASE = '/api/v1';

  /* URL에서 link_token 읽기 — 값을 DOM·sessionStorage에 저장하지 않는다 */
  function getLinkToken() {
    return new URLSearchParams(window.location.search).get('token') || '';
  }

  function show(id) {
    ['view-loading','view-normal','view-normal-btn','view-expired','view-revoked','view-error'].forEach(function (v) {
      var el = document.getElementById(v);
      if (el) el.style.display = v === id ? (v === 'view-normal' ? 'flex' : 'block') : 'none';
    });
    if (id === 'view-normal') {
      document.getElementById('view-normal-btn').style.display = 'flex';
    }
  }

  function formatDate(iso) {
    var parts = iso.split('-');
    return parts[0] + '년 ' + parseInt(parts[1], 10) + '월 ' + parseInt(parts[2], 10) + '일';
  }

  /* 세션 체크 — 이미 인증됐으면 guide로 이동 */
  async function checkSession(token) {
    if (!token) return;
    try {
      var res = await fetch(API_BASE + '/patient-auth/session?link_token=' + encodeURIComponent(token));
      if (res.ok) {
        window.location.replace('guide.html?token=' + encodeURIComponent(token));
        return true;
      }
    } catch (_) {}
    return false;
  }

  /* context API 호출 */
  async function loadContext(token) {
    var res = await fetch(API_BASE + '/patient-auth/context', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ link_token: token }),
    });

    if (res.ok) {
      var data = await res.json();
      document.getElementById('ctx-hospital-date').textContent =
        data.hospital_name + ' · ' + formatDate(data.visited_at);
      document.getElementById('ctx-visit-desc').textContent =
        formatDate(data.visited_at) + ' 진료 안내입니다';
      document.getElementById('ctx-phone').textContent = data.masked_phone;
      show('view-normal');
      return 'ok';
    }

    var body = {};
    try { body = await res.json(); } catch (_) {}
    if (body.code === 'LINK_EXPIRED') return 'expired';
    if (body.code === 'LINK_REVOKED') return 'revoked';
    return 'error';
  }

  /* re-issue 요청 */
  async function requestReIssue(token, msgId, btnId) {
    var btn = document.getElementById(btnId);
    var msg = document.getElementById(msgId);
    btn.disabled = true;
    try {
      var res = await fetch(API_BASE + '/patient-auth/link/re-issue', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ link_token: token }),
      });
      if (res.status === 202 || res.ok) {
        msg.textContent = '새 링크를 요청했어요. 문자로 안내드릴게요.';
        msg.style.display = 'block';
        return;
      }
      var body = {};
      try { body = await res.json(); } catch (_) {}
      msg.textContent = body.message || '요청 중 오류가 생겼어요. 병원에 문의해 주세요.';
      msg.style.display = 'block';
      btn.disabled = false;
    } catch (_) {
      msg.textContent = '요청 중 오류가 생겼어요. 잠시 후 다시 시도해 주세요.';
      msg.style.display = 'block';
      btn.disabled = false;
    }
  }

  /* OTP 발급 요청 → otp-verify.html로 이동 */
  async function issueOtp(token) {
    var btn = document.getElementById('btn-issue');
    btn.disabled = true;
    try {
      var res = await fetch(API_BASE + '/patient-auth/otp/issue', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ link_token: token }),
      });
      if (res.ok) {
        var data = await res.json();
        window.location.href =
          'otp-verify.html?token=' + encodeURIComponent(token) +
          '&expires_at=' + encodeURIComponent(data.expires_at) +
          '&retry_after=' + encodeURIComponent(data.retry_after_seconds);
        return;
      }
      var body = {};
      try { body = await res.json(); } catch (_) {}
      alert(body.message || '인증번호 전송 중 오류가 생겼어요. 잠시 후 다시 시도해 주세요.');
    } catch (_) {
      alert('인증번호 전송 중 오류가 생겼어요. 잠시 후 다시 시도해 주세요.');
    } finally {
      btn.disabled = false;
    }
  }

  /* 진입 */
  async function init() {
    var token = getLinkToken();
    if (!token) { show('view-error'); return; }

    var redirected = await checkSession(token);
    if (redirected) return;

    var status = await loadContext(token);
    if (status === 'expired') {
      show('view-expired');
      document.getElementById('btn-reissue-expired').addEventListener('click', function () {
        requestReIssue(token, 'reissue-msg-expired', 'btn-reissue-expired');
      });
    } else if (status === 'revoked') {
      show('view-revoked');
      document.getElementById('btn-reissue-revoked').addEventListener('click', function () {
        requestReIssue(token, 'reissue-msg-revoked', 'btn-reissue-revoked');
      });
    } else if (status === 'error') {
      show('view-error');
    } else {
      document.getElementById('btn-issue').addEventListener('click', function () {
        issueOtp(token);
      });
    }
  }

  init();
})();
</script>
</body>
</html>

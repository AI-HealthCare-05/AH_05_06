<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>본인 확인 · 케어온</title>
<link rel="stylesheet" href="../css/tokens.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--surface);
    color: var(--tx);
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
  }

  @media (min-width: 431px) {
    body { background: var(--bg); }
  }

  .app {
    position: relative;
    max-width: 430px;
    margin: 0 auto;
    min-height: 100dvh;
    background: var(--surface);
    display: flex;
    flex-direction: column;
    padding: 0 24px 48px;
  }

  /* 상단 로고 영역 */
  .otp-top {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-bottom: 0;
  }

  .otp-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
  }

  .otp-logo__icon {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--p);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700;
    color: var(--p-deep);
    flex-shrink: 0;
    overflow: hidden;
  }

  .otp-logo__icon img {
    width: 100%; height: 100%; object-fit: cover;
  }

  .otp-logo__info { display: flex; flex-direction: column; gap: 2px; }
  .otp-logo__name { font-size: 16px; font-weight: 700; }
  .otp-logo__sub  { font-size: 13px; color: var(--tx-muted); }

  .otp-title {
    font-size: 28px; font-weight: 700;
    line-height: 1.3;
    margin-bottom: 8px;
  }
  .otp-sub {
    font-size: 15px; color: var(--tx-muted);
  }

  /* 전화번호 카드 */
  .otp-phone-card {
    margin-top: 28px;
    background: var(--bg);
    border-radius: var(--r-card);
    padding: 24px 20px;
    text-align: center;
  }
  .otp-phone-card__number {
    font-size: 26px; font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .otp-phone-card__hint {
    font-size: 14px; color: var(--tx-muted);
  }

  /* 하단 버튼 영역 */
  .otp-bottom {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding-top: 32px;
    margin-top: auto;
  }

  .otp-btn {
    width: 100%;
    padding: 16px;
    background: var(--p);
    border: none;
    border-radius: var(--r-btn);
    font-family: var(--font);
    font-size: 17px; font-weight: 600;
    color: var(--p-deep);
    cursor: pointer;
    transition: opacity .15s;
  }
  .otp-btn:hover { opacity: .88; }

  .otp-change {
    background: none; border: none;
    font-family: var(--font);
    font-size: 14px; color: var(--p-dark);
    cursor: pointer;
    text-decoration: none;
  }
</style>
</head>
<body>

<div class="app">
  <div class="otp-top">
    <div class="otp-logo">
      <span class="otp-logo__icon">
        <img src="../assets/logo.png" alt="" aria-hidden="true" onerror="this.parentElement.textContent='+'">
      </span>
      <div class="otp-logo__info">
        <span class="otp-logo__name">케어온</span>
        <span class="otp-logo__sub">여성의원 · 2026.08.13 진료</span>
      </div>
    </div>

    <h1 class="otp-title">본인 확인이<br>필요해요</h1>
    <p class="otp-sub">2026년 8월 13일 진료 안내입니다</p>

    <div class="otp-phone-card">
      <div class="otp-phone-card__number">010-****-1234</div>
      <div class="otp-phone-card__hint">이 번호로 인증번호를 보내드려요</div>
    </div>
  </div>

  <div class="otp-bottom">
    <button type="button" class="otp-btn" id="otp-request">인증번호 받기</button>
    <button type="button" class="otp-change">번호가 바뀌셨나요?</button>
  </div>
</div>

<script>
document.getElementById('otp-request').addEventListener('click', function () {
  /* 목업 선택과 guide token fragment를 저장소에 복사하지 않고 다음 단계로 잇는다. */
  location.href = 'otp-verify.html' + location.search + location.hash;
});
</script>

</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>진료 안내 · 케어온</title>
<link rel="stylesheet" href="../css/tokens.css" />
<link rel="stylesheet" href="../css/guide.css" />
<link rel="stylesheet" href="../css/chat.css?v=5" />
</head>
<body>

<div class="app" id="app">

  <!-- 헤더 -->
  <header class="header">
    <div class="header__top">
      <div class="header__logo">
        <span class="header__icon"><img src="../assets/logo.png" alt="" aria-hidden="true" style="width:100%;height:100%;object-fit:cover;"></span>
        <span class="header__name">케어온</span>
      </div>
      <button type="button" class="header__pdf-btn" id="pdf-btn">PDF 저장</button>
    </div>
    <p class="header__patient" id="header-patient"></p>
    <div id="tab-bar" class="tab-bar" role="tablist" aria-label="안내 항목"></div>
  </header>

  <!-- 스크롤 바디 -->
  <div class="body" id="body">
    <div style="padding:40px 20px;text-align:center;color:var(--tx-muted)">
      안내를 불러오는 중이에요…
    </div>
  </div>

</div>

<!-- 챗봇 패널 -->
<div class="chat-backdrop" id="chat-backdrop"></div>
<div class="chat-panel" id="chat-panel" role="dialog" aria-label="상담 챗봇" aria-modal="true">
  <div class="chat-panel__handle"></div>
  <div class="chat-panel__header">
    <div class="chat-panel__title">
      <span class="chat-panel__title-icon"><img src="../assets/chat_bot.png" alt="" aria-hidden="true"></span>
      케어온 상담
    </div>
    <button type="button" class="chat-panel__close" id="chat-close" aria-label="닫기">✕</button>
  </div>
  <div class="chat-messages" id="chat-messages"></div>
  <div class="chat-input-area">
    <textarea class="chat-input" id="chat-input" rows="1"
      placeholder="궁금한 것을 입력하세요" aria-label="질문 입력"></textarea>
    <button type="button" class="chat-abort" id="chat-abort" aria-label="중단">■</button>
    <button type="button" class="chat-send" id="chat-send" disabled aria-label="보내기">↑</button>
  </div>
</div>

<!-- 컴포넌트 -->
<script src="../component/fab.js?v=3"></script>
<script src="../component/sheet.js?v=3"></script>
<script src="../component/guide-footer.js?v=3"></script>

<!-- API + 페이지 로직 -->
<script src="../js/guide-api.js?v=5"></script>
<script src="../js/guide.js?v=4"></script>
<script src="../js/chat.js?v=6"></script>

</body>
</html>

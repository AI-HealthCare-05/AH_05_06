<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>오늘 확인 · 케어온</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/checkin.css" />
  </head>
  <body>
    <!-- P7-1~P7-6 오늘 확인 (KEY-98)
         환자가 문자로 받은 링크로 들어온다 — 로그인하지 않는다.
         링크 토큰 발급·검증은 P1 몫이라 여기서는 ?t= 로 받는다. -->
    <main class="sheet">
      <header class="sheet__head">
        <button class="sheet__back" type="button" aria-label="뒤로">‹</button>
        <h1 class="sheet__title">오늘 확인</h1>
        <span class="sheet__round" id="round">—</span>
      </header>

      <div id="form">
        <p class="ask">약은 잘 드시고<br />계신가요?</p>
        <div id="meds"></div>

        <p class="ask ask--sub">통증이 있었나요?</p>
        <div id="pain"></div>

        <p class="ask ask--sub">메모 (선택)</p>
        <textarea class="note" id="note" rows="3" aria-label="메모"></textarea>

        <button class="save" type="button" id="save" disabled>저장</button>
        <!-- 문의하기를 눌렀을 때 답하는 자리. 창구가 아직 없어서
             「지금 할 수 있는 일」을 알려 준다 (#55 리뷰). -->
        <p class="ask-note" id="ask-note" role="status" tabindex="-1" hidden></p>
        <!-- 저장 실패는 **바로 알려야 한다** — 화면에는 떴는데 소리로는 아무
             일도 없으면, 못 보는 사람은 저장된 줄 알고 창을 닫는다 (KEY-129). -->
        <p class="error" id="error" role="alert" aria-live="assertive" hidden></p>
        <p class="foot">ⓘ 담당 의료진이 요청한 기록이에요</p>
      </div>

      <!-- 저장이 끝나면 폼이 통째로 이 안으로 바뀐다. 초점을 여기로 옮기지
           않으면 사라진 버튼에 있던 커서가 `body` 로 떨어져, 「저장됐어요」를
           못 듣는다 (KEY-129). -->
      <div id="state" role="status" aria-live="polite" tabindex="-1" hidden></div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/checkin-api.js"></script>
    <script src="/js/checkin.js"></script>
  </body>
</html>

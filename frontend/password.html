<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>비밀번호 설정 · 복약 안내 도우미</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/auth.css" />
  </head>
  <body class="auth">
    <!-- L-3 첫 로그인 — 건너뛸 수 없다.
         어드민이 정해준 첫 비밀번호를 그대로 쓰면 정해준 사람이 그 비밀번호를
         계속 알고 있게 된다. 그래서 어드민은 첫 비밀번호만 정하고,
         본인이 처음 로그인할 때 스스로 바꾼다.
         뒤로 가는 길을 두지 않는다 — 로그아웃 말고는 나갈 곳이 없다. -->
    <main class="card">
      <div class="card__head">
        <h1 class="card__title">비밀번호를 새로 정해 주세요</h1>
        <p class="card__lead">최초 로그인입니다.<br />발급받은 비밀번호는 더 이상 사용하지 않습니다.</p>
      </div>

      <form class="card__body" id="password-form" novalidate>
        <div class="field">
          <label class="field__label" for="new-password">새 비밀번호</label>
          <div class="field__row">
            <input
              class="field__input"
              id="new-password"
              name="new_password"
              type="password"
              autocomplete="new-password"
              required
            />
            <button class="reveal" type="button" data-reveal="new-password" aria-pressed="false">보기</button>
          </div>
          <p class="field__hint" id="new-password-hint">영문 · 숫자 · 기호를 섞어 8자 이상</p>
        </div>

        <div class="field">
          <label class="field__label" for="confirm-password">비밀번호 확인</label>
          <div class="field__row">
            <input
              class="field__input"
              id="confirm-password"
              name="confirm_password"
              type="password"
              autocomplete="new-password"
              required
            />
            <button class="reveal" type="button" data-reveal="confirm-password" aria-pressed="false">보기</button>
          </div>
        </div>

        <div class="alert" id="error" role="alert" aria-live="assertive" hidden>
          <div class="alert__line" id="error-line"></div>
        </div>

        <button class="button" type="submit" id="submit">설정 완료</button>
      </form>

      <p class="clinic">여성의원</p>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/session.js"></script>
    <script src="/js/password.js"></script>
  </body>
</html>

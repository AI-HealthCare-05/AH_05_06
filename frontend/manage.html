<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>관리 · 케어온</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/shell.css" />
    <link rel="stylesheet" href="/css/blocks.css" />
    <link rel="stylesheet" href="/css/detail.css" />
    <link rel="stylesheet" href="/css/manage.css" />
  </head>
  <body class="shell">
    <!-- S2 관리 (KEY-234)
         와이어프레임 S2-3 원문 캡션: 「앞으로 나갈 것 · 보류는 맨 위에서
         이유와 함께」.

         **왼쪽 목록이 없는 화면이다.** 다른 의료진 화면과 달리 한 환자를 골라
         파고드는 자리가 아니라, 의원 전체에서 안 나간 것을 훑어 잡는 자리다.
         원문도 전폭으로 그린다.

         이번에 담는 것은 **발송 예정(S2-3)** 하나다. 환자 관리(S2-1)와 발송
         이력(S2-4)은 자리만 세우고 눌리지 않게 둔다 — 눌러도 아무 일 없는
         버튼은 「된다」고 말한다. -->

    <header class="topbar">
      <span class="topbar__brand"
        >케어온 <span class="topbar__clinic">도로시여성의원</span></span
      >
      <nav class="topbar__nav">
        <!-- **관리는 S2, 설정은 D2 다.** -->
        <a class="topbar__tab" href="/patients.html">현황</a>
        <button class="topbar__tab" type="button" aria-current="page">
          관리
        </button>
        <a class="topbar__tab" href="/settings.html">설정</a>
      </nav>
      <div class="topbar__right">
        <span class="who">
          <span class="who__name" id="who-name">—</span>
          <span class="who__roles" id="who-roles"></span>
        </span>
        <button class="icon-button" type="button" aria-label="알림">
          <svg
            class="icon"
            viewBox="0 0 20 20"
            aria-hidden="true"
            focusable="false"
          >
            <path
              d="M10 2.5a4.5 4.5 0 0 0-4.5 4.5v3L4 12.5h12L14.5 10V7A4.5 4.5 0 0 0 10 2.5Z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linejoin="round"
            />
            <path
              d="M8 15a2 2 0 0 0 4 0"
              fill="none"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linecap="round"
            />
          </svg>
        </button>
        <button
          class="icon-button"
          type="button"
          id="logout"
          aria-label="로그아웃"
        >
          <svg
            class="icon"
            viewBox="0 0 20 20"
            aria-hidden="true"
            focusable="false"
          >
            <path
              d="M10 3v6"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
            <path
              d="M14.6 5.6a6.5 6.5 0 1 1-9.2 0"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </div>
    </header>

    <div class="main">
      <main class="pane">
        <!-- 원문의 세 갈래 (S2-1 · S2-3 · S2-4). 지금 선 것은 가운데 하나다.
             `aria-selected` 로 고른 것을 말한다 — 이 저장소의 탭이 다 그렇고,
             `.tab` 의 검정 채움도 그 속성으로 걸린다(`css/blocks.css`). -->
        <div class="tabs" role="tablist" aria-label="관리 갈래">
          <button class="tab tab--later" type="button" role="tab" aria-selected="false" aria-disabled="true" title="환자 관리(S2-1)는 아직 만들지 않았습니다">환자 관리</button>
          <button class="tab" type="button" role="tab" aria-selected="true">발송 예정</button>
          <button class="tab tab--later" type="button" role="tab" aria-selected="false" aria-disabled="true" title="발송 이력(S2-4)은 아직 만들지 않았습니다">발송 이력</button>
        </div>

        <div class="send-top">
          <div class="chips" id="chips"></div>
          <span class="send-top__grow"></span>
          <label class="sr-only" for="days">기간</label>
          <select class="send-days" id="days"></select>
        </div>

        <div id="table"></div>

        <p class="send-foot" id="summary"></p>
        <p class="send-cut" id="cut" hidden></p>

        <!-- **아직 없는 것을 적어 둔다.** 원문의 할 일 칸에는 넷이 있는데
             (고치기 · 문자 충전 · 시각 변경 · 즉시 발송) 그중 갈 데가 있는
             것은 번호 수정 하나뿐이다. 나머지는 API 도 발송기도 없다. -->
        <p class="note">
          ⓘ 예정은 자동 발송됩니다 · 번호가 잘못된 줄은 「번호 수정」으로 그
          환자의 기본정보에서 고칩니다
        </p>
        <p class="note">
          ⓘ 시각 변경 · 즉시 발송 · 문자 충전은 아직 없습니다 — 문자를 실제로
          보내는 발송기가 아직 없습니다
        </p>
      </main>
    </div>

    <script src="/js/session.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/message-words.js"></script>
    <script src="/js/schedule-rules.js"></script>
    <script src="/js/messages-api.js"></script>
    <script src="/js/manage.js"></script>
  </body>
</html>

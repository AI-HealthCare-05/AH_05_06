<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>진료 안내 · 케어온</title>
  <link rel="stylesheet" href="/patient_wireframe/css/tokens.css" />
  <link rel="stylesheet" href="/patient_wireframe/css/guide.css?v=10" />
  <link rel="stylesheet" href="/patient_wireframe/css/chat.css?v=5" />
</head>
<body>

<div class="app" id="app">
  <header class="header">
    <div class="header__top">
      <div class="header__logo">
        <span class="header__icon"><img src="/patient_wireframe/assets/logo.png" alt="" aria-hidden="true" style="width:100%;height:100%;object-fit:cover;"></span>
        <span class="header__name">케어온</span>
      </div>
      <button type="button" class="header__pdf-btn" id="pdf-btn">PDF 저장</button>
    </div>
    <p class="header__patient" id="header-patient"></p>
    <div id="tab-bar" class="tab-bar" role="tablist" aria-label="안내 항목"></div>
  </header>

  <main class="body" id="guide-body">
    <div class="guide-loading">안내를 불러오는 중이에요…</div>
  </main>
  <p class="sr-only" id="guide-say" role="status" aria-live="polite"></p>
</div>

<div class="chat-backdrop" id="chat-backdrop"></div>
<div class="chat-panel" id="chat-panel" role="dialog" aria-label="상담 챗봇" aria-modal="true">
  <div class="chat-panel__handle"></div>
  <div class="chat-panel__header">
    <div class="chat-panel__title">
      <span class="chat-panel__title-icon"><img src="/patient_wireframe/assets/chat_bot.png" alt="" aria-hidden="true"></span>
      케어온 상담
    </div>
    <button type="button" class="chat-panel__close" id="chat-close" aria-label="닫기">✕</button>
  </div>
  <div class="chat-messages" id="chat-messages"></div>
  <div class="chat-input-area">
    <textarea class="chat-input" id="chat-input" rows="1"
      placeholder="궁금한 것을 입력하세요" aria-label="질문 입력"></textarea>
    <button type="button" class="chat-abort" id="chat-abort" aria-label="중단">■</button>
    <button type="button" class="chat-send" id="chat-send" disabled aria-label="보내기">↑</button>
  </div>
</div>

<script src="/patient_wireframe/component/fab.js?v=9"></script>
<script src="/patient_wireframe/component/sheet.js?v=3"></script>
<script src="/patient_wireframe/component/guide-footer.js?v=9"></script>
<script src="/patient_wireframe/js/guide-api.js?v=11"></script>
<script src="/js/chatbot-api.js?v=6"></script>
<script src="/patient_wireframe/js/guide.js?v=11"></script>
<script src="/patient_wireframe/js/chat.js?v=6"></script>
</body>
</html>

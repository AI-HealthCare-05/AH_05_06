name: ci.yml

on:
  push:
    branches:
      - main
      - develop
      - 'release/*'
      - 'hotfix/*'
  pull_request:
    # feature 브랜치를 base 로 하는 스택형 PR(예: KEY-60 → KEY-59)도 검사한다.
    # 이 줄이 없으면 그런 PR 은 lint 도 test 도 안 도는데, GitHub 의 mergeStateStatus 는
    # CLEAN 이라 화면에서는 초록불로 보인다 — 검사를 안 받은 것과 통과한 것이 같아 보인다.
    branches:
      - main
      - develop
      - 'release/*'
      - 'hotfix/*'
      - 'feat/**'
      - 'fix/**'
      - 'docs/**'
      - 'test/**'
      - 'chore/**'
      - 'refactor/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        # mypy 는 tortoise · fastapi 의 타입을 봐야 한다. app 그룹 없이 돌리면
        # import 를 못 찾아 58건이 쏟아진다 — 검사가 아니라 소음이 된다.
        run: uv sync --group app --frozen

      - name: Run Ruff Check (Linting)
        run: uv run ruff check .

      - name: Run Ruff Format Check
        run: uv run ruff format . --check

      - name: Run Mypy (Type Check)
        # `app` 만 주면 `ai_worker/` 7파일이 통째로 빠진다 — docker compose 가 띄우는
        # 정식 서비스인데 타입 검사를 한 번도 안 받게 된다. ruff 는 이미 `.` 이다.
        run: uv run mypy . --explicit-package-bases

  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: pw1234
          MYSQL_DATABASE: ai_health
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      # 세션은 Redis 에 산다(KEY-73). 이것이 없으면 **토큰을 들고 앱을 지나는**
      # 검사가 전부 죽는다 — 로그인 자체가 아니라 그 뒤 모든 보호 경로다.
      # 지금까지 안 걸린 것은 auth 검사가 `FakeRedis` 로 우회했기 때문인데,
      # 그 우회가 실제 동작을 가린 적이 있다(`#37` 의 TTL 건). 진짜를 띄운다.
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --group app --frozen

      - name: Check if tests exist
        id: check_tests
        # tests 폴더나 test_*.py 파일이 있는지 확인
        run: |
          if [ -d "tests" ] || [ $(find . -name "test_*.py" | wc -l) -gt 0 ]; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Tests with Coverage
        if: steps.check_tests.outputs.has_tests == 'true'
        run: |
          uv run coverage run -m pytest app
          uv run coverage report -m

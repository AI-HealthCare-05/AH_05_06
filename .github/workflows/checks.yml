name: ci.yml

on:
  push:
    branches:
      - main
      - develop
      - 'release/*'
      - 'hotfix/*'
  pull_request:
    # feature 브랜치를 base 로 하는 스택형 PR(예: KEY-60 → KEY-59)도 검사한다.
    # 이 줄이 없으면 그런 PR 은 lint 도 test 도 안 도는데, GitHub 의 mergeStateStatus 는
    # CLEAN 이라 화면에서는 초록불로 보인다 — 검사를 안 받은 것과 통과한 것이 같아 보인다.
    branches:
      - main
      - develop
      - 'release/*'
      - 'hotfix/*'
      - 'feat/**'
      - 'fix/**'
      - 'docs/**'
      - 'test/**'
      - 'chore/**'
      - 'refactor/**'

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      COMPOSE_PROJECT_NAME: key230-bootstrap-ci
      DOCKER_USER: key230
      DOCKER_REPOSITORY: bootstrap
      APP_VERSION: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # 기본 Compose의 멀티 아키텍처 배포 빌드 대신 이 러너의 이미지 한 개를
      # 만든다. bootstrap은 아래의 실제 Compose 서비스/DB를 그대로 사용한다.
      - name: Build local API image
        run: docker build -f app/Dockerfile -t key230/bootstrap:app-ci .
      - name: Bootstrap fresh database and repeat
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/bootstrap-local.sh
          before=$(sha256sum .env .bootstrap.local.env)
          ./scripts/bootstrap-local.sh
          test "$before" = "$(sha256sum .env .bootstrap.local.env)"
      - name: Stop isolated CI services
        if: always()
        # 별도 job의 일회용 프로젝트만 정리한다. env 생성 전 실패하면
        # compose에 필요한 설정이 없으므로 실행할 리소스도 없다.
        run: |
          if [ -f .env ]; then
            docker compose down --volumes
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        # mypy 는 tortoise · fastapi 의 타입을 봐야 한다. app 그룹 없이 돌리면
        # import 를 못 찾아 58건이 쏟아진다 — 검사가 아니라 소음이 된다.
        run: uv sync --group app --frozen

      - name: Run Ruff Check (Linting)
        run: uv run ruff check .

      - name: Run Ruff Format Check
        run: uv run ruff format . --check

      - name: Run Mypy (Type Check)
        # `app` 만 주면 `ai_worker/` 7파일이 통째로 빠진다 — docker compose 가 띄우는
        # 정식 서비스인데 타입 검사를 한 번도 안 받게 된다. ruff 는 이미 `.` 이다.
        run: uv run mypy . --explicit-package-bases

      - name: Check OpenAPI contract artifact
        # OpenAPI 생성 자체는 DB에 연결하지 않지만, 앱과 같은 Config 검증을 거쳐
        # DTO·라우터를 불러온다. CI 전용 일회용 값만 준다.
        env:
          DB_PASSWORD: ci-throwaway-not-a-secret
        run: |
          uv run python scripts/generate_openapi.py --check
          uv run pytest -q scripts/tests/test_generate_openapi.py

      - name: Check ERD artifact
        # ERD 생성기도 DB에 안 붙지만 같은 이유로 Config 검증을 거친다.
        # 이 검사를 부르는 곳이 저장소 전체에 docs 안내 문구 하나뿐이었다
        # (iljun-sys 리뷰, KEY-343) — 모델을 건드려도 아무 일도 안 일어나서
        # 다음 사람이 ERD를 깨뜨려도 CI가 조용했다.
        env:
          DB_PASSWORD: ci-throwaway-not-a-secret
        run: |
          uv run python scripts/generate_erd.py --check
          uv run pytest -q scripts/tests/test_generate_erd.py

      # 프런트는 빌드가 없어서 `node --test` 하나로 끝난다 — package.json 도
      # node_modules 도 잠금파일도 없다. 새 의존성 없이 계약 규칙을 붙잡는다.
      #
      # 이번 스프린트에 프런트에서 나온 결함 다섯이 **전부 사람이 눌러서**
      # 나왔다. 사람이 브라우저를 열어야만 드러나는 상태를 그대로 두면
      # 다음 스프린트에도 같은 종류가 같은 방식으로 나온다.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Frontend Contract Tests
        # 러너 기본값은 `TZ=UTC` 다. 그대로 두면 현지 getter 와 UTC getter 가
        # 같은 값을 내서 **「오늘 날짜는 현지 기준이다」 검사가 아무것도 확인하지
        # 못한다** — 이희진 님이 `#64` 리뷰에서 짚어 주셨다. 병원 시간대로 고정한다.
        env:
          TZ: Asia/Seoul
        # 폴더가 아니라 **파일들**을 넘긴다. Node 22 부터 `--test` 의 위치 인자를
        # 훑을 폴더가 아니라 불러올 모듈로 보기 때문이다 — 폴더를 주면
        # `MODULE_NOT_FOUND` 로 죽는다. CI 는 20 으로 고정돼 있어 안 걸리지만
        # 최신 Node 를 쓰는 로컬에서는 검사를 아예 못 돌린다.
        #
        #                              node:20  node:22  node:24
        #   --test frontend/tests/       통과     ✖       ✖
        #   --test frontend/tests        통과     ✖       ✖
        #   --test frontend/tests/*.test.js  통과   통과    통과
        #
        # 다만 글롭이 **아무것도 못 찾으면 종료코드가 0** 이다. 검사 파일 이름이
        # 바뀌거나 사라진 날 CI 가 조용히 초록불이 된다 — node 자체 글롭
        # (`"**/*.test.js"`) 도, 인자 없는 자동탐색도 마찬가지다. 이 PR 이
        # 막으려는 것이 바로 「검사가 헛도는데 초록불인 상태」라 여기서 막는다.
        run: |
          shopt -s failglob
          node --test frontend/tests/*.test.js

  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          # 잡 안에서만 사는 일회용 컨테이너다. 비밀이 아니라는 것을
          # 이름으로 못박는다 — 예전 값은 저장소 이력에 새어 나간 것이었다.
          MYSQL_ROOT_PASSWORD: ci-throwaway-not-a-secret
          MYSQL_DATABASE: ai_health
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      # 세션은 Redis 에 산다(KEY-73). 이것이 없으면 **토큰을 들고 앱을 지나는**
      # 검사가 전부 죽는다 — 로그인 자체가 아니라 그 뒤 모든 보호 경로다.
      # 지금까지 안 걸린 것은 auth 검사가 `FakeRedis` 로 우회했기 때문인데,
      # 그 우회가 실제 동작을 가린 적이 있다(`#37` 의 TTL 건). 진짜를 띄운다.
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --group app --frozen

      - name: Check if tests exist
        id: check_tests
        # tests 폴더나 test_*.py 파일이 있는지 확인
        run: |
          if [ -d "tests" ] || [ $(find . -name "test_*.py" | wc -l) -gt 0 ]; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
          fi

      # **운영과 같은 등급의 계정을 만든다** — KEY-358.
      #
      # 여태 CI 는 `DB_USER: root` 로 돌았다. 운영 앱 계정(`ozcoding`)에는 없는
      # 권한이 CI 에는 있어서, **권한이 모자라 생기는 결함은 구조적으로 안 보였다.**
      # 2026-09-16 배포가 그것으로 멈췄다 — KEY-238 의 `CREATE TRIGGER` 가 운영에서
      # `1419` 로 죽었는데 CI 는 초록이었다.
      #
      # 로컬은 이미 제한 계정으로 돈다(`infra/docker/initdb.d/01-test-db.sql`).
      # 그 파일 주석이 같은 말을 적어 두었다 — 「CI(root)에서만 돌아 아무도 몰랐다」.
      # **CI 만 혼자 셌다.** 여기서 맞춘다.
      #
      # 권한 모양은 그 파일을 그대로 본뜬다. `test\_%` 의 `\_` 는 밑줄 그 글자다 —
      # 안 쓰면 `_` 가 「아무 글자 하나」가 되어 엉뚱한 이름까지 걸린다.
      #
      # `log_bin_trust_function_creators` 는 운영 compose 의 플래그와 같은 자리다
      # (KEY-358). 서비스 컨테이너에는 `command` 를 못 주므로 root 로 켠다.
      - name: Create a production-shaped database account
        env:
          MYSQL_PWD: ci-throwaway-not-a-secret
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot <<'SQL'
          SET GLOBAL log_bin_trust_function_creators = 1;
          CREATE USER 'ci_app'@'%' IDENTIFIED BY 'ci-throwaway-not-a-secret';
          GRANT ALL ON `ai_health`.* TO 'ci_app'@'%';
          CREATE DATABASE IF NOT EXISTS test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          GRANT ALL ON `test`.* TO 'ci_app'@'%';
          GRANT ALL ON `test\_%`.* TO 'ci_app'@'%';
          SQL

      - name: Run Tests with Coverage
        if: steps.check_tests.outputs.has_tests == 'true'
        # `DB_PASSWORD` 는 코드 기본값이 없다(KEY-110). 위 서비스 컨테이너와
        # 같은 값을 여기서 명시한다 — 기본값에 기대면 그 값이 곧 공유 비밀이 된다.
        #
        # `-n auto` 로 pytest-xdist 병렬화 시험 중 — 워커별 DB 이름·Redis 논리
        # DB 분리는 `app/tests/conftest.py`/`app/core/redis_client.py` 가 맡는다.
        # 커버리지는 `coverage run` 대신 `pytest-cov` 를 쓴다 — xdist 워커는
        # 별도 프로세스라 `coverage run` 하나로는 워커 안 실행분을 못 잡는다.
        env:
          DB_HOST: 127.0.0.1
          # 🚩 **`root` 가 아니다** — KEY-358. 운영과 같은 등급으로 돈다.
          DB_USER: ci_app
          DB_PASSWORD: ci-throwaway-not-a-secret
          DB_NAME: ai_health
        run: |
          uv run pytest -n auto --cov=app --cov=ai_worker --cov-report=term-missing app ai_worker

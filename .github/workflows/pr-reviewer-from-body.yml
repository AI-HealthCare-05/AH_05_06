name: pr-reviewer-from-body

on:
  pull_request:
    types: [opened, ready_for_review, edited]

permissions:
  pull-requests: write

jobs:
  add-reviewer:
    runs-on: ubuntu-latest
    steps:
      - name: Extract and request reviewer from PR body
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const author = context.payload.pull_request.user.login.toLowerCase();

            // "## 👀 리뷰어" 섹션만 잘라낸다 — 다음 "## " 제목이 나오면 거기서 멈춘다.
            //
            // 이모지는 **있어도 되고 없어도 된다.** 예전 정규식은 `/👀?/` 였는데,
            // `u` 플래그가 없으면 👀 가 서로게이트 쌍(👀)으로 쪼개져
            // `?` 가 뒤쪽 하나에만 걸린다 — 앞쪽 \uD83D 가 **필수**가 되어
            // 「## 리뷰어」는 영영 안 맞았다. 그런데 등록 실패는 core.warning 이라
            // 검사는 초록불이었다. 리뷰어가 아무도 안 붙은 채로 PR 이 하루씩
            // 서 있었다 (`#90` · `#91` · `#92`).
            const chunks = body.split(/\n(?=##\s)/);
            const reviewerChunk = chunks.find(c => /^##\s*(?:👀\s*)?리뷰어/iu.test(c.trim()));
            const section = reviewerChunk ? reviewerChunk.replace(/^##[^\n]*\n?/, "") : "";

            const seen = new Set();
            const handles = [];
            for (const m of section.matchAll(/@([\w-]+)/g)) {
              const handle = m[1];
              const key = handle.toLowerCase();
              if (key === author || seen.has(key)) continue;
              seen.add(key);
              handles.push(handle);
            }

            // 계정 하나가 유효하지 않아도 나머지는 계속 등록되도록 개별 요청한다.
            for (const reviewer of handles) {
              try {
                await github.rest.pulls.requestReviewers({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.pull_request.number,
                  reviewers: [reviewer],
                });
              } catch (error) {
                core.warning(`리뷰어 ${reviewer} 등록 실패: ${error.message}`);
              }
            }

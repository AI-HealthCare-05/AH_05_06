name: pr-reviewer-from-body

on:
  pull_request:
    types: [opened, ready_for_review, edited]

permissions:
  pull-requests: write

jobs:
  add-reviewer:
    runs-on: ubuntu-latest
    steps:
      - name: Extract and request reviewer from PR body
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const author = context.payload.pull_request.user.login;
            const section = body.split(/##\s*👀?\s*리뷰어/i)[1] || "";
            const handles = [...section.matchAll(/@([\w-]+)/g)]
              .map(m => m[1])
              .filter(h => h !== author);
            if (handles.length === 0) return;
            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              reviewers: [...new Set(handles)],
            });

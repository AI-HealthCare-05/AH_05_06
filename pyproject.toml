[project]
name = "ai-health-example"
version = "0.1.0"
description = "AI 헬스케어 파이널 프로젝트 예시용"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=46.0.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dateutil>=2.9.0.post0",
    "redis>=7.1.0",
    "tomlkit>=0.14.0",
    "tzdata>=2026.3; platform_system == 'Windows'",
]

[dependency-groups]
ai = [
    "scikit-learn>=1.8.0",
    "torch",
    "torchvision",
    "torchaudio",
    "sentence-transformers>=5.2.0"
]
app = [
    "aerich>=0.9.2",
    "asyncmy>=0.2.11",
    "bcrypt<=4.0.1",
    "fastapi[standard]>=0.128.0",
    "httpx>=0.28.1",
    "orjson>=3.11.5",
    "passlib[bcrypt]>=1.7.4",
    "pyjwt>=2.10.1",
    "tortoise-orm>=0.25.3",
    "uvicorn>=0.40.0",
]
# **워커가 실제로 임포트하는 것만 담는다** — KEY-198.
#
# `app` 그룹 전체를 깔면 워커가 안 쓰는 것이 함께 들어간다. 임포트 그래프를
# 실제로 재서 (`ai_worker.main` 을 임포트해 놓고 로드된 서드파티 최상위 모듈을
# 셌다) 아래 넷을 뺐다.
#
#     passlib   워커 임포트 체인에 없다. 비밀번호를 다루는 것은 앱뿐이다
#     bcrypt    같다. 트레이스에 뜨는 bcrypt 는 `cryptography` 가 끌어온 것이고,
#               `cryptography` 는 최상위 의존성이라 이 그룹과 무관하다
#     aerich    `TORTOISE_APP_MODELS` 의 `aerich.models` 때문에 런타임에 들어왔다.
#               워커는 `WORKER_TORTOISE_ORM` 을 쓰므로 이제 필요 없다 —
#               `aerich upgrade`·`downgrade` CLI 가 워커 이미지에서 빠진다
#     uvicorn   워커는 HTTP 를 안 연다. `fastapi[standard]` 가 어차피 끌고 온다
#
# **그 `[standard]` 도 뺐다** — KEY-207. 위 줄이 적어 둔 그대로, 명시 목록에서만
# 빠지고 이미지에는 남아 있었다. extra 가 끌고 오던 것을 임포트 그래프에 대고
# 하나씩 쟀다 (`ai_worker.main` 을 임포트한 뒤 `sys.modules` 를 본다).
#
#     uvicorn · watchfiles · websockets · httptools · uvloop · jinja2
#               **임포트 그래프에 아예 없다.** 워커는 HTTP 를 안 열고 CMD 도
#               `python -m ai_worker.main` 이다.
#               (`jinja2` 는 이미지에는 남는다 — `ai` 그룹의 torch 가 쓴다.
#                여기서 없어지는 것은 `fastapi[standard]` 를 타고 오던 길이다)
#     python-multipart
#               실리기는 하는데 **starlette 이 제 발로 끌어온다**
#               (`starlette/formparsers.py` — `try: import python_multipart`).
#               없으면 `multipart = None` 로 스스로 물러선다. 폼을 파싱하는
#               자리는 라우터인데 워커 사슬에는 라우터가 하나도 안 실린다
#     email-validator
#               같다. `fastapi/openapi/models.py` 가
#               `try: import email_validator` 로 가져오고 없으면 제 `EmailStr`
#               대체를 쓴다. `pydantic.EmailStr` 을 실제로 쓰는 우리 모듈
#               (`dtos/auth.py`·`services/auth.py`·`repositories/user_repository.py`)
#               은 **워커 사슬에 없다** — 그것이 실렸다면 pydantic 이 클래스를
#               세우는 자리에서 이 패키지를 요구했을 것이다
#
# `fastapi` 는 남는다 — 워커가 서버를 띄우진 않지만 `app.*` 의 DTO·오류 타입이
# 그것을 타고 들어온다. 임포트를 실제로 여는 자리는 `app/core/db/databases.py:1`
# 이고, 그 파일이 `initialize_tortoise(app: FastAPI)` 로 그 이름을 쓴다.
# `pyjwt` 도 남는다 (`app.core.jwt.*` 경유로 실제 사용).
worker = [
    "asyncmy>=0.2.11",
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
    "orjson>=3.11.5",
    "pyjwt>=2.10.1",
    "tortoise-orm>=0.25.3",
]
dev = [
    "coverage>=7.13.2",
    "mypy>=1.19.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14.14",
    "types-passlib>=1.7.7.20250602",
    "types-python-dateutil>=2.9.0.20260124",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.aerich]
tortoise_orm = "app.core.db.databases.TORTOISE_ORM"
location = "./app/core/db/migrations"
src_folder = "./."

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[tool.ruff]
# 기본 라인 길이 설정
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# 사용할 린트 규칙들 선택
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C90", # mccabe
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
]
ignore = ["UP046", "E501"]

# 특정 파일에서 무시할 규칙들
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"db/migrations/*" = ["ALL"]

[tool.ruff.format]
# 포매터 설정
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[project]
name = "ai-health-example"
version = "0.1.0"
description = "AI 헬스케어 파이널 프로젝트 예시용"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=46.0.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dateutil>=2.9.0.post0",
    "redis>=7.1.0",
    "tomlkit>=0.14.0",
    "tzdata>=2026.3; platform_system == 'Windows'",
]

[dependency-groups]
ai = [
    "scikit-learn>=1.8.0",
    "torch",
    "torchvision",
    "torchaudio",
    "sentence-transformers>=5.2.0"
]
app = [
    "aerich>=0.9.2",
    "asyncmy>=0.2.11",
    "bcrypt<=4.0.1",
    "fastapi[standard]>=0.128.0",
    "httpx>=0.28.1",
    "orjson>=3.11.5",
    "passlib[bcrypt]>=1.7.4",
    "pyjwt>=2.10.1",
    "tortoise-orm>=0.25.3",
    "uvicorn>=0.40.0",
]
# **워커가 실제로 임포트하는 것만 담는다** — KEY-198.
#
# `app` 그룹 전체를 깔면 워커가 안 쓰는 것이 함께 들어간다. 임포트 그래프를
# 실제로 재서 (`ai_worker.main` 을 임포트해 놓고 로드된 서드파티 최상위 모듈을
# 셌다) 아래 넷을 뺐다.
#
#     passlib   워커 임포트 체인에 없다. 비밀번호를 다루는 것은 앱뿐이다
#     bcrypt    같다. 트레이스에 뜨는 bcrypt 는 `cryptography` 가 끌어온 것이고,
#               `cryptography` 는 최상위 의존성이라 이 그룹과 무관하다
#     aerich    `TORTOISE_APP_MODELS` 의 `aerich.models` 때문에 런타임에 들어왔다.
#               워커는 `WORKER_TORTOISE_ORM` 을 쓰므로 이제 필요 없다 —
#               `aerich upgrade`·`downgrade` CLI 가 워커 이미지에서 빠진다
#     uvicorn   워커는 HTTP 를 안 연다. `fastapi[standard]` 가 어차피 끌고 온다
#
# `fastapi` 는 남는다 — 워커가 서버를 띄우진 않지만 `app.*` 의 DTO·오류 타입이
# 그것을 타고 들어온다. `pyjwt` 도 남는다 (`app.core.jwt.*` 경유로 실제 사용).
worker = [
    "asyncmy>=0.2.11",
    "fastapi[standard]>=0.128.0",
    "httpx>=0.28.1",
    "orjson>=3.11.5",
    "pyjwt>=2.10.1",
    "tortoise-orm>=0.25.3",
]
dev = [
    "coverage>=7.13.2",
    "mypy>=1.19.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14.14",
    "types-passlib>=1.7.7.20250602",
    "types-python-dateutil>=2.9.0.20260124",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.aerich]
tortoise_orm = "app.core.db.databases.TORTOISE_ORM"
location = "./app/core/db/migrations"
src_folder = "./."

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[tool.ruff]
# 기본 라인 길이 설정
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# 사용할 린트 규칙들 선택
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C90", # mccabe
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
]
ignore = ["UP046", "E501"]

# 특정 파일에서 무시할 규칙들
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"db/migrations/*" = ["ALL"]

[tool.ruff.format]
# 포매터 설정
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# 운영·Pilot DB 를 **RDS 로 옮길 때** 얹는 오버레이 — KEY-201.
#
# **서버에서는 이름으로 얹는다.** 배포 스크립트(`scripts/lib.sh:65·110`)가
# `docker compose` 를 `-f` 없이 부르고, `scripts/deployment.sh:215` 가
# `docker-compose.prod.yml` 을 `~/project/docker-compose.yml` 로 덮어쓴다.
# 그래서 `-f` 를 넘길 자리가 없다 — 이 파일을 옆에 이 이름으로 두면 compose 가
# 알아서 합친다.
#
#   scp infra/docker/docker-compose.rds.yml \
#       ubuntu@<ip>:~/project/docker-compose.override.yml
#
# 배포 스크립트는 `docker-compose.yml` 만 덮어쓰므로 **다음 배포에도 그대로
# 이어진다.** 되돌릴 때는 그 파일을 지운다.
#
# 손으로 확인할 때는 `-f` 두 개로도 같은 판이 선다.
#
#   docker compose \
#     -f infra/docker/docker-compose.prod.yml \
#     -f infra/docker/docker-compose.rds.yml \
#     config
#
# ## 왜 `DB_HOST` 만 바꾸면 안 되나
#
# 앱이 붙는 곳은 `DB_HOST` 하나로 정해진다. 그래서 그 값만 RDS 로 바꿔도 앱은
# RDS 를 쓴다 — 거기까지는 맞다. 그런데 `docker-compose.prod.yml` 은
#
#   * `mysql` 컨테이너를 **여전히 띄우고**
#   * `fastapi` · `ai-worker` 가 그것의 `service_healthy` 를 **기다린다**
#
# 즉 아무도 안 쓰는 MySQL 이 EC2 에서 계속 돌고, 그 볼륨에는 **옮기기 전의
# 진료 기록이 그대로 남는다.** 백업 대상도 아니고 지우는 절차도 없는 자리에
# 환자 데이터 사본이 남는 것이라, 「DB_HOST 만 바꾸면 된다」로 끝내면 안 된다.
#
# ## 어떻게 끄나
#
# `profiles` 를 붙이면 그 서비스는 프로필을 켰을 때만 뜬다. 다만 **그것만으로는
# 안 된다** — 프로필이 꺼진 서비스를 `depends_on` 이 가리키면 compose 가 아예
# 거부한다(실측: `service "fastapi" depends on undefined service "mysql"`).
# 그래서 기다림도 함께 갈아 끼운다.
#
# **`!override` 다, `!reset` 이 아니다.** `!reset` 은 그 아래를 통째로 지우고
# 값을 다시 받지 않는다 — 그렇게 썼더니 redis 기다림까지 사라졌다(실측:
# `depends_on: None`). 두 태그 다 Compose v2.24+ 문법이다.
#
# ## 되돌리기
#
# 이 파일을 빼고 다시 `up -d` 하면 컨테이너 MySQL 로 돌아온다. `DB_HOST` 도
# 함께 `mysql` 로 되돌려야 한다 — 한쪽만 되돌리면 앱이 없는 곳을 찾는다.
services:
  mysql:
    # 로컬 개발(`docker-compose.yml`)은 이 파일을 안 읽는다 — 거기 MySQL 은 그대로다.
    profiles: ["container-db"]

  # **`redis` 기다림은 그대로 둔다.** 지우면 앱이 redis 보다 먼저 떠서 세션·큐가
  # 첫 몇 초 동안 죽는다. `mysql` 만 빼고 나머지를 그대로 다시 적는다.
  fastapi:
    depends_on: !override
      redis:
        condition: service_healthy

  ai-worker:
    depends_on: !override
      redis:
        condition: service_healthy

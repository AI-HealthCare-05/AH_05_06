services:
  # 1. Redis (메시지 브로커 및 캐싱)
  redis:
    image: redis:alpine
    container_name: redis
    networks:
      - ws
    ports:
      # **밖으로 열지 않는다** — 앱은 `REDIS_HOST=redis` 로 도커 네트워크를
      # 지나간다. 호스트에 붙이는 것은 사람이 들여다볼 때뿐이라 `127.0.0.1`
      # 이면 충분하고, 보안 그룹을 한 번 잘못 열어도 인터넷에서 안 닿는다.
      - "127.0.0.1:${REDIS_PORT}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 2. Database
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
    # ${환경변수명} 문법은 OS 환경변수 혹은 .env에서 해당 환경변수명과 일치하는 항목이 있으면 대입합니다.
    # 반드시 사전에 .env에 해당 항목이 존재하는지 확인해야 합니다.
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    ports:
      # 앱은 `DB_HOST=mysql` 로 닿는다. 여기가 공개로 열리면 **환자 표가
      # 통째로 인터넷에 붙는다** — MinIO 를 묶은 것과 같은 까닭이다.
      - "127.0.0.1:${DB_EXPOSE_PORT}:${DB_PORT}"
    networks:
      - ws
    volumes:
      - mysql_data:/var/lib/mysql  # 컨테이너가 삭제돼도 데이터는 호스트 파일시스템에 남음
    command: # 한글 저장을 위한 문자셋 설정 (필수!)
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --port=${DB_PORT}
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. API Server (FastAPI)
  fastapi:
    container_name: fastapi
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:app-${APP_VERSION}  # APP_VERSION은 빌드된 이미지의 버전관리를 위함입니다. v1.0.0 형식으로 사용합니다.
    env_file: .env
    volumes:
      - static_volume:/app/templates
      - media_volume:/app/media
    restart: always
    ports:
      # nginx 는 `upstream fastapi { server fastapi:8000; }` 로 도커 네트워크를
      # 지난다 — 호스트 포트가 없어도 돈다. 여기를 열면 **nginx 를 건너뛰고**
      # 앱에 직접 닿는 길이 하나 더 생긴다.
      - "127.0.0.1:8000:8000"
    networks:
      - ws
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. AI Worker (Model 학습 및 추론)
  ai-worker:
    container_name: ai-worker
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:ai-${AI_WORKER_VERSION}  # AI_WORKER_VERSION은 빌드된 이미지의 버전관리를 위함입니다. V1.0.0 형식으로 사용합니다.
    env_file: .env
    restart: always
    mem_limit: 4G
    networks:
      - ws
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 5. Nginx (웹 서버 - 요청 리버스 프록시로 전달)
  nginx:
    container_name: nginx
    # 프런트를 구운 우리 이미지다 — 태그로 어떤 화면이 떴는지 특정한다 (KEY-189).
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:web-${WEB_VERSION}
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/vol/web/static
      - media_volume:/vol/web/media
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    networks:
      - ws
    depends_on:
      - fastapi

  # 6. certbot: SSL 인증서 발급담당
  certbot:
    image: certbot/certbot
    container_name: auto-certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 48h & wait $${!}; done;'"
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - nginx

  # 7. MinIO (합성 EMR 이미지 보관 — S3 호환)
  #
  # 팀이 KEY-190 고정 PNG 를 **같은 바이트로** 나눠 갖는 자리다 (KEY-191).
  # 자세한 것은 `docs/ocr-fixtures.md` §5.
  #
  # **포트를 밖으로 열지 않는다.** `127.0.0.1` 에만 묶어서, 보안 그룹을
  # 잘못 열어도 공개 인터넷에서는 안 닿는다 — 팀은 SSH 터널로 붙는다.
  #
  #     ssh -N -L 9000:127.0.0.1:9000 -L 9001:127.0.0.1:9001 ubuntu@<서버>
  #
  # 「팀 6인만 접근」이 자격증명 하나에만 걸려 있지 않게 하는 것이 요점이다.
  # 버킷 정책은 `private` 이고 익명 GET 은 403 이지만, 그것은 **두 번째 문**이다.
  minio:
    container_name: minio
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - ws
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mysql_data:
    name: mysql_data
  static_volume:
    name: static_volume
  media_volume:
    name: media_volume
  certbot-conf:
    name: certbot-conf
  certbot-www:
    name: certbot-www
  minio_data:
    name: minio_data

networks:
  ws:
    name: ws
    driver: bridge

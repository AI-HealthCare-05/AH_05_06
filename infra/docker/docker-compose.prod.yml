services:
  # 1. Redis (메시지 브로커 및 캐싱)
  redis:
    image: redis:alpine
    container_name: redis
    networks:
      - ws
    ports:
      # **밖으로 열지 않는다** — 앱은 `REDIS_HOST=redis` 로 도커 네트워크를
      # 지나간다. 호스트에 붙이는 것은 사람이 들여다볼 때뿐이라 `127.0.0.1`
      # 이면 충분하고, 보안 그룹을 한 번 잘못 열어도 인터넷에서 안 닿는다.
      #
      # **호스트 쪽과 안쪽을 갈라 둔다** — `mysql` 이 이미 그렇게 한다
      # (`DB_EXPOSE_PORT` : `DB_PORT`). redis 만 `REDIS_PORT` 하나로 두 자리를
      # 겸하고 있었는데, 그 값은 **앱이 붙을 때도 쓰는 값**이다 (`config.py`).
      #
      # 그래서 호스트 포트를 6379 아닌 값으로 바꾸면 앱이 `redis:<그 값>` 으로
      # 붙으려다 실패한다 — 배포 리허설에서 `REDIS_PORT=16379` 로 두었더니
      # health 가 `redis: connection_failed` 였다 (KEY-193).
      #
      # 바깥은 `REDIS_EXPOSE_PORT`, 컨테이너 안은 `REDIS_PORT` 로 **각각** 정한다.
      # 둘 다 없으면 6379 를 쓴다. 안쪽이 6379 로 고정된 것이 아니다 —
      # `command` · `healthcheck` 도 같은 변수를 본다 (한금준 님 `#155` ①).
      - "127.0.0.1:${REDIS_EXPOSE_PORT:-6379}:${REDIS_PORT:-6379}"
    # **기본값을 붙여 둔다** — 이 값이 이제 `ports` · `command` · `healthcheck`
    # 세 곳에 걸려 있어서, 비면 redis 컨테이너가 아예 안 뜬다. 예전에는
    # 컨테이너 쪽이 `6379` 하드코딩이라 비어도 떴다 — 갈라 놓으면서 실패
    # 범위가 넓어진 자리라 되돌려 둔다 (이희진 님 `#155` ②).
    #
    # **컨테이너가 `REDIS_PORT` 를 실제로 듣게 한다** — `mysql` 의
    # `--port=${DB_PORT}` 와 같은 자리다. 이것이 없으면 redis 는 늘 6379 를
    # 듣고 `REDIS_PORT` 는 앱만 아는 값이 된다. 그러면 그 값을 바꾸는 순간
    # 앱은 없는 포트로 붙는다.
    command: redis-server --port ${REDIS_PORT:-6379}
    healthcheck:
      test: [ "CMD", "redis-cli", "-p", "${REDIS_PORT:-6379}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 2. Database
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
    # ${환경변수명} 문법은 OS 환경변수 혹은 .env에서 해당 환경변수명과 일치하는 항목이 있으면 대입합니다.
    # 반드시 사전에 .env에 해당 항목이 존재하는지 확인해야 합니다.
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    ports:
      # 앱은 `DB_HOST=mysql` 로 닿는다. 여기가 공개로 열리면 **환자 표가
      # 통째로 인터넷에 붙는다** — MinIO 를 묶은 것과 같은 까닭이다.
      - "127.0.0.1:${DB_EXPOSE_PORT:-3306}:${DB_PORT:-3306}"
    networks:
      - ws
    volumes:
      - mysql_data:/var/lib/mysql  # 컨테이너가 삭제돼도 데이터는 호스트 파일시스템에 남음
    command: # 한글 저장을 위한 문자셋 설정 (필수!)
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 기본값을 붙인다 — 비면 `--port=` 가 되어 mysqld 가 거부한다.
      # redis 와 같은 자리다 (이희진 님 `#155` ②).
      - --port=${DB_PORT:-3306}
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. API Server (FastAPI)
  fastapi:
    container_name: fastapi
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:app-${APP_VERSION}  # APP_VERSION은 빌드된 이미지의 버전관리를 위함입니다. v1.0.0 형식으로 사용합니다.
    env_file: .env
    volumes:
      - static_volume:/app/templates
      # **앱이 쓰는 자리에 붙인다.** `UPLOAD_DIR` 이 `/vol/web/media` 인데
      # 볼륨은 `/app/media` 에 붙어 있었다 — 업로드가 **볼륨 밖 컨테이너
      # 안쪽**에 떨어져서, 재시작하면 사라지고 nginx·워커도 못 봤다.
      # nginx 는 처음부터 `/vol/web/media` 로 붙이고 있었다 (KEY-197 후속).
      - media_volume:/vol/web/media
    restart: always
    ports:
      # nginx 는 `upstream fastapi { server fastapi:8000; }` 로 도커 네트워크를
      # 지난다 — 호스트 포트가 없어도 돈다. 여기를 열면 **nginx 를 건너뛰고**
      # 앱에 직접 닿는 길이 하나 더 생긴다.
      - "127.0.0.1:8000:8000"
    networks:
      - ws
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. AI Worker (Model 학습 및 추론)
  ai-worker:
    container_name: ai-worker
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:ai-${AI_WORKER_VERSION}  # AI_WORKER_VERSION은 빌드된 이미지의 버전관리를 위함입니다. V1.0.0 형식으로 사용합니다.
    env_file: .env
    volumes:
      # **업로드 파일을 fastapi 와 나눠 쓴다.** 워커는 `document.file_path` 를
      # 그대로 열어 CLOVA 에 보낸다 — 이 볼륨이 없으면 `FileNotFoundError` 로
      # 죽고 OCR 이 전부 실패한다 (KEY-197 후속).
      - media_volume:/vol/web/media
    restart: always
    mem_limit: 4G
    networks:
      - ws
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 5. Nginx (웹 서버 - 요청 리버스 프록시로 전달)
  nginx:
    container_name: nginx
    # 프런트를 구운 우리 이미지다 — 태그로 어떤 화면이 떴는지 특정한다 (KEY-189).
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:web-${WEB_VERSION}
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/vol/web/static
      - media_volume:/vol/web/media
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    networks:
      - ws
    depends_on:
      - fastapi

  # 6. certbot: SSL 인증서 발급담당
  certbot:
    image: certbot/certbot
    container_name: auto-certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 48h & wait $${!}; done;'"
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - nginx

  # 7. MinIO (합성 EMR 이미지 보관 — S3 호환)
  #
  # 팀이 KEY-190 고정 PNG 를 **같은 바이트로** 나눠 갖는 자리다 (KEY-191).
  # 자세한 것은 `docs/ocr-fixtures.md` §5.
  #
  # **포트를 밖으로 열지 않는다.** `127.0.0.1` 에만 묶어서, 보안 그룹을
  # 잘못 열어도 공개 인터넷에서는 안 닿는다 — 팀은 SSH 터널로 붙는다.
  #
  #     ssh -N -L 9000:127.0.0.1:9000 -L 9001:127.0.0.1:9001 ubuntu@<서버>
  #
  # 「팀 6인만 접근」이 자격증명 하나에만 걸려 있지 않게 하는 것이 요점이다.
  # 버킷 정책은 `private` 이고 익명 GET 은 403 이지만, 그것은 **두 번째 문**이다.
  minio:
    container_name: minio
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - ws
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mysql_data:
    name: mysql_data
  static_volume:
    name: static_volume
  media_volume:
    name: media_volume
  certbot-conf:
    name: certbot-conf
  certbot-www:
    name: certbot-www
  minio_data:
    name: minio_data

networks:
  ws:
    name: ws
    driver: bridge

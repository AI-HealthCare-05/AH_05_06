upstream fastapi {
    server fastapi:8000;
}

# http
server {
    listen 80;
    server_name 도메인;

    # 추후 certbot ssl 인증서 갱신 시 필요
    location /.well-known/acme-challenge/ {
       root /var/www/certbot;
    }

    # 🚩 **API 명세는 밖으로 안 연다** — KEY-334.
    #
    # 앱도 `ENV=prod` 면 이 셋을 `None` 으로 꺼 둔다(`app/main.py`). 그런데
    # 2026-09-14 에 `ENV=dev` 로 내리자(KEY-248 검증기 때문에 솔라피 값이 없는
    # 동안 택한 조치) 그 분기가 풀려 **인터넷에 그대로 열렸다.**
    #
    # 그래서 여기서도 막는다. **`ENV` 가 무엇이든** 밖에서는 안 열린다 —
    # 앱 쪽 분기는 그대로 두고 이중으로 막는 것이다. 안에서 볼 일이 있으면
    # 터널로 `fastapi:8000` 에 직접 붙는다.
    location ~ ^/api/(docs|redoc|openapi\.json) {
        return 404;
    }

    # 80 포트에서는 **아무것도 서빙하지 않는다** — 전부 https 로 넘긴다.
    # 여기서 프런트를 주면 환자가 평문으로 안내를 보게 된다 (KEY-189).
    # 링크 토큰 경로는 리다이렉트 access log에도 원문을 남기지 않는다.
    # HTTP→HTTPS 리다이렉트 요청도 기본 access log에 경로가 남는다.
    location ^~ /api/v1/guides/ {
        access_log off;
        return 301 https://$host$request_uri;
    }

    location ^~ /api/v1/checkins/ {
        access_log off;
        return 301 https://$host$request_uri;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# https
server {
    server_name 도메인;

    listen 443 ssl;

    ssl_certificate /etc/letsencrypt/live/도메인/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/도메인/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 업로드 크기 제한 — 앱의 `MAX_UPLOAD_SIZE_MB` 와 맞춘다.
    # nginx 기본값은 1m 이라, 안 적으면 검사지 사진 한 장(보통 2~5MB)이
    # FastAPI 에 닿기 전에 413 으로 잘린다. 그 응답 본문은 HTML 이라 프런트의
    # `res.json()` 이 파싱하려다 파서 오류를 화면에 띄운다
    # (이희진 님 `#137` 요청).
    client_max_body_size 20m;

    # 🚩 **여기도 막는다** — KEY-334. 위 80 블록은 리다이렉트만 하므로,
    # HTTPS 로 바로 들어오는 요청은 이 블록이 받는다. 한쪽만 막으면 뚫린다.
    location ~ ^/api/(docs|redoc|openapi\.json) {
        return 404;
    }

    # Uvicorn 마스킹과 별개로 Nginx가 URL의 링크 토큰을 저장하지 않게 한다.
    location ^~ /api/v1/guides/ {
        access_log off;
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location ^~ /api/v1/checkins/ {
        access_log off;
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
    location /api/ {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
    }

    location / {
        root /vol/web/frontend;
        index index.html;
        try_files $uri $uri/ =404;
    }
}

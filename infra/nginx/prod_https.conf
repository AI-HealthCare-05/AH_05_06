upstream fastapi {
    server fastapi:8000;
}

# http
server {
    listen 80;
    server_name 도메인;

    # 추후 certbot ssl 인증서 갱신 시 필요
    location /.well-known/acme-challenge/ {
       root /var/www/certbot;
    }

    # 80 포트에서는 **아무것도 서빙하지 않는다** — 전부 https 로 넘긴다.
    # 여기서 프런트를 주면 환자가 평문으로 안내를 보게 된다 (KEY-189).
    # 링크 토큰 경로는 리다이렉트 access log에도 원문을 남기지 않는다.
    # HTTP→HTTPS 리다이렉트 요청도 기본 access log에 경로가 남는다.
    location ^~ /api/v1/guides/ {
        access_log off;
        return 301 https://$host$request_uri;
    }

    location ^~ /api/v1/checkins/ {
        access_log off;
        return 301 https://$host$request_uri;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# https
server {
    server_name 도메인;

    listen 443 ssl;

    ssl_certificate /etc/letsencrypt/live/도메인/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/도메인/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 업로드 크기 제한 — 앱의 `MAX_UPLOAD_SIZE_MB` 와 맞춘다.
    # nginx 기본값은 1m 이라, 안 적으면 검사지 사진 한 장(보통 2~5MB)이
    # FastAPI 에 닿기 전에 413 으로 잘린다. 그 응답 본문은 HTML 이라 프런트의
    # `res.json()` 이 파싱하려다 파서 오류를 화면에 띄운다
    # (이희진 님 `#137` 요청).
    client_max_body_size 20m;

    # Uvicorn 마스킹과 별개로 Nginx가 URL의 링크 토큰을 저장하지 않게 한다.
    location ^~ /api/v1/guides/ {
        access_log off;
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location ^~ /api/v1/checkins/ {
        access_log off;
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
    location /api/ {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
    }

    location / {
        root /vol/web/frontend;
        index index.html;
        try_files $uri $uri/ =404;
    }
}

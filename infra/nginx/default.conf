upstream fastapi {
    server fastapi:8000;
}

server {
    server_name 도메인 혹은 EC2_IP;

    listen 80;

    # 추후 certbot ssl 인증서 갱신 시 필요
    location /.well-known/acme-challenge/ {
       root /var/www/certbot;
    }

    # 업로드 크기 제한 — 앱의 `MAX_UPLOAD_SIZE_MB` 와 맞춘다.
    # nginx 기본값은 1m 이라, 안 적으면 검사지 사진 한 장(보통 2~5MB)이
    # FastAPI 에 닿기 전에 413 으로 잘린다. 그 응답 본문은 HTML 이라 프런트의
    # `res.json()` 이 파싱하려다 파서 오류를 화면에 띄운다
    # (이희진 님 `#137` 요청).
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
    }

    location / {
        root /vol/web/frontend;
        index index.html;
        try_files $uri $uri/ =404;

        # **고친 것이 바로 보여야 한다** — 이 파일은 로컬 개발 전용이다
        # (배포는 prod_http.conf · prod_https.conf 를 쓴다).
        #
        # nginx 는 정적 파일에 Last-Modified 와 ETag 만 붙이고 Cache-Control 은
        # 안 붙인다. 그러면 브라우저가 **추측 캐싱**을 해서, frontend/ 를 고쳐도
        # 화면이 안 바뀐다. 1차 시연 준비 때 이걸 코드 결함으로 30분 오해했고,
        # 그 뒤로도 같은 자리에서 여러 번 멈췄다.
        #
        # 운영에는 넣지 않는다 — 거기서는 캐싱이 있어야 한다. 대신 배포마다
        # 파일이 바뀌므로 ETag 로 재검증되게 두는 것이 맞다.
        add_header Cache-Control "no-store" always;
    }
}

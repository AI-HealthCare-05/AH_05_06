upstream fastapi {
    server fastapi:8000;
}

server {
    server_name 도메인 혹은 EC2_IP;

    listen 80;

    # 추후 certbot ssl 인증서 갱신 시 필요
    location /.well-known/acme-challenge/ {
       root /var/www/certbot;
    }

    # 업로드 크기 제한 — 앱의 `MAX_UPLOAD_SIZE_MB` 와 맞춘다.
    # nginx 기본값은 1m 이라, 안 적으면 검사지 사진 한 장(보통 2~5MB)이
    # FastAPI 에 닿기 전에 413 으로 잘린다. 그 응답 본문은 HTML 이라 프런트의
    # `res.json()` 이 파싱하려다 파서 오류를 화면에 띄운다
    # (이희진 님 `#137` 요청).
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
    }

    location / {
        root /vol/web/frontend;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
